<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DashTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a cheerful video site that is honest about being a time capsule
   IDEA: a video site frozen the day before Geometry Dash 2.1 (Jan 16, 2017), with a time machine back to any update
   PICTURE: YouTube's thumbnails (a drawn level as fallback), an uploads-per-month strip with the update eras under it
   COLOUR and TYPE: white or near-black ground, ink text, one lime accent; Lilita One + Roboto
   LAYOUT: sticky header with search and the "Frozen at" pill, side nav, chip row, grid; watch page with player, details and up next */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f0f0f);--ink:light-dark(#0f0f0f,#f1f1f1);--mut:light-dark(#5c5c5c,#aaa);--line:light-dark(#e3e3e3,#2b2b2b);--chip:light-dark(#f2f2f2,#272727);--chip2:light-dark(#e4e4e4,#3a3a3a);--acc:#9be22d;--hdr:light-dark(rgba(255,255,255,.95),rgba(15,15,15,.95))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:clip}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto minmax(0,620px) auto;justify-content:space-between;align-items:center;gap:16px;height:60px;padding:0 16px;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:4px}
.ib{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--chip)}
.logo{display:flex;align-items:center;gap:8px;font-size:21px;letter-spacing:-.4px;padding:6px 8px;border-radius:10px;white-space:nowrap}
.logo b{font-weight:900}
.logo small{font-size:12px;color:var(--mut);font-weight:500;letter-spacing:0;align-self:flex-start;margin-top:2px}
.search{display:flex;height:44px}
.search input{flex:1;border:1px solid var(--line);border-right:0;border-radius:22px 0 0 22px;padding:0 18px;background:var(--bg);font-size:16px}
.search button{flex:none;width:64px;border:1px solid var(--line);border-radius:0 22px 22px 0;background:var(--chip);cursor:pointer;display:grid;place-items:center}
.search button:hover{background:var(--chip2)}
.capw{position:relative}
.cap{display:flex;align-items:center;gap:9px;font-size:14px;padding:0 14px;height:36px;border-radius:18px;border:0;background:var(--chip);white-space:nowrap;cursor:pointer}
.cap:hover,.cap[aria-expanded=true]{background:var(--chip2)}
.cap i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(155,226,45,.3)}
.tip{position:absolute;right:0;top:calc(100% + 8px);width:max-content;max-width:min(320px,calc(100vw - 24px));background:var(--ink);color:var(--bg);font-size:13px;line-height:1.45;padding:9px 12px;border-radius:9px;opacity:0;visibility:hidden;transition:opacity .15s;z-index:40;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.capw:hover .tip,.cap:focus-visible+.tip{opacity:1;visibility:visible}
body.tmo .tip{display:none}
.tm{position:fixed;top:66px;right:16px;z-index:55;width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 82px);overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.28);padding:6px 18px 16px;font-size:14px}
.tm[hidden]{display:none}
.tmh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tmh h2{font:400 24px/1.2 "Lilita One",Roboto,sans-serif;margin:8px 0 4px}
.tm h3{font-size:14px;font-weight:700;margin:16px 0 6px}
.tm .now{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:10px 12px;margin:6px 0 0;line-height:1.45}
.tm .now i{flex:none;width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(155,226,45,.3)}
.tm .tms{margin:0 0 8px;color:var(--mut)}
.ups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.up{border:0;background:var(--chip);border-radius:10px;padding:7px 8px;text-align:left;cursor:pointer;line-height:1.25}
.up:hover{background:var(--chip2)}.up b{display:block;font-size:16px}.up small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up.on{background:var(--ink);color:var(--bg)}.up.on small{color:inherit;opacity:.75}
.ck{display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer}.ck input{width:18px;height:18px;accent-color:var(--acc)}
.tmr{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.tmr label{display:flex;align-items:center;gap:6px}
.tm input[type=date]{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px}
.tm .src{font-size:12.5px;color:var(--mut);margin:14px 0 0;line-height:1.45}
.tmx{margin-top:18px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr)}
body.mini .wrap{grid-template-columns:minmax(0,1fr)}body.mini nav.side{display:none}
nav.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:12px;scrollbar-width:thin}
.nv{display:flex;align-items:center;gap:18px;min-height:44px;padding:0 12px;border-radius:10px;font-size:15px}
button.nv{width:100%;border:0;background:none;cursor:pointer;text-align:left}
.nv:hover{background:var(--chip)}.nv.on{background:var(--chip);font-weight:700}
.nv svg{flex:none}.nv .n{margin-left:auto;color:var(--mut);font-size:13px;font-weight:400}
.nv .av{width:24px;height:24px;font-size:12px}
.side h3{font-size:16px;font-weight:500;margin:4px 12px 6px}
.side hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.scrim{display:none}
main{padding:0 24px 40px}
.capsule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:32px;align-items:end;padding:24px 26px;margin:18px 0 6px;border-radius:18px;background:var(--chip)}
.capsule h1,.ph h1,.chhead h1{font:400 clamp(30px,3.6vw,44px)/1.05 "Lilita One",Roboto,sans-serif;margin:0 0 10px;text-wrap:balance}
.capsule p,.ph p,.chhead p{margin:0 0 16px;color:var(--mut);max-width:62ch}
.capsule .acts2{display:flex;flex-wrap:wrap;gap:8px}
.tlh{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--mut);margin-bottom:8px}
.bars{position:relative;display:flex;align-items:flex-end;gap:3px;height:110px}
.bar{flex:1;background:var(--ink);opacity:.82;border-radius:3px 3px 0 0}
.bar.z{opacity:.14}.bar.out{opacity:.16}.bar:hover{background:var(--acc);opacity:1}
.mk{position:absolute;top:-4px;bottom:0;width:2px;margin-left:-1px;background:repeating-linear-gradient(var(--ink) 0 5px,transparent 5px 9px);pointer-events:none}
.eras{position:relative;height:22px;margin-top:6px}
.era{position:absolute;top:0;bottom:0;border-right:2px solid var(--chip);border-radius:5px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--mut);font-size:11px;font-weight:700;line-height:22px;text-align:center;overflow:hidden;white-space:nowrap;cursor:pointer}
.era.alt{background:color-mix(in srgb,var(--ink) 17%,transparent)}.era:hover{color:var(--ink)}
.era.on{background:var(--acc);color:#0f0f0f}
.yrs{display:flex;gap:3px;font-size:13px;color:var(--mut);margin-top:4px;height:20px}
.yrs span{flex:1;position:relative}.yrs em{position:absolute;left:0;font-style:normal;white-space:nowrap}
.ph{padding:22px 0 2px}.ph p{margin-bottom:8px}
.chips{position:sticky;top:60px;z-index:10;background:var(--bg);display:flex;gap:10px;align-items:center;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--chip);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{background:var(--chip2)}.chip.on{background:var(--ink);color:var(--bg)}
.sep{flex:none;width:1px;height:24px;background:var(--line)}
.sort{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:14px;cursor:pointer}
.rh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 8px;font-size:15px;color:var(--mut)}
.rg{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--ink)}.sl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:34px 16px;padding-top:8px}
.card{display:flex;flex-direction:column;gap:12px}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222}
.th svg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform .25s}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card:hover .th svg,.card:hover .th img{transform:scale(1.04)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.82);color:#fff;font-size:12.5px;font-weight:500;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.sv{position:absolute;left:8px;bottom:8px;background:var(--acc);color:#0f0f0f;font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:4px}
.row{display:flex;gap:12px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
img.av{display:block;object-fit:cover;background:var(--chip)}
.avl{flex:none;display:block;border-radius:50%}
.ti{font-weight:500;font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 4px;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--mut);line-height:1.45}
.ver{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:3px 5px;border-radius:5px;border:1px solid var(--line);color:var(--mut);vertical-align:1px;white-space:nowrap}
.nw{white-space:nowrap}
.lnk{border:0;background:none;padding:0;cursor:pointer;color:inherit}
.moreb{display:flex;justify-content:center;padding:28px 0 0}
.empty{text-align:center;padding:70px 16px;color:var(--mut)}.empty .big{font-size:20px;font-weight:500;color:var(--ink);margin:0 0 6px}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;padding-top:24px}
.player{position:relative;display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.player svg,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cm{margin-top:26px}.cm h2{font-size:18px;font-weight:700;margin:0 0 12px}
.cmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.ct{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;margin-bottom:18px}
.ct img,.ct .av{width:40px;height:40px;border-radius:50%;background:var(--chip)}
.ct .who{font-size:13px;font-weight:500}.ct .who span{color:var(--mut);font-weight:400}
.ct p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45}
.ct .lk{font-size:13px;color:var(--mut)}
.note{background:var(--chip);border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:14px}.note p{margin:6px 0}
.note.warn{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 0;border-left:4px solid var(--acc)}
.note form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note input{flex:1;min-width:200px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px}
.player .sh{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.72))}
.play{position:absolute;left:50%;top:50%;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;background:#fff;color:#0f0f0f;display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.35);transition:transform .15s}
.player:hover .play{transform:scale(1.08)}
.pcap{position:absolute;left:16px;right:16px;bottom:12px;color:#fff;font-size:14px;display:flex;justify-content:space-between;gap:12px}
h1.vt{font-size:21px;font-weight:700;line-height:1.3;margin:14px 0 12px;overflow-wrap:anywhere}
.chan{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.chan .av{width:42px;height:42px}.cn{font-weight:500}.cs{font-size:13px;color:var(--mut)}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{height:40px;padding:0 16px;border-radius:20px;border:0;background:var(--chip);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pill:hover{background:var(--chip2)}.pill.dark{background:var(--ink);color:var(--bg)}.pill.on{background:var(--acc);color:#0f0f0f}
.pill:disabled{opacity:.45;cursor:default}
.note .pill{background:var(--bg)}
.info{background:var(--chip);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14px}
.info .k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 18px;margin:12px 0}
.info .k span{display:block;color:var(--mut);font-size:13px}
.info u,.foot u{text-underline-offset:2px}
.next h2{font-size:16px;font-weight:500;margin:0 0 12px}
.mini{display:grid;grid-template-columns:168px minmax(0,1fr);gap:10px;margin-bottom:10px;border-radius:10px}
.mini .th{border-radius:8px}.mini .ti{font-size:14px}.mini .meta{font-size:13px}
.list{max-width:920px;padding-top:10px}.list .mini{grid-template-columns:246px minmax(0,1fr);gap:16px;margin-bottom:14px}.list .ti{font-size:16px}
.chhead{display:flex;align-items:center;gap:20px;padding:26px 0 18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.chhead .av{width:80px;height:80px;font-size:32px}.chhead p{margin:0}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;max-width:86ch}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:.2s;pointer-events:none;z-index:60;max-width:calc(100vw - 32px);overflow-wrap:anywhere}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1180px){.watch{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}
 nav.side{position:fixed;left:0;top:0;height:100%;width:270px;z-index:50;background:var(--bg);transform:translateX(-104%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
 body.dr nav.side{transform:none}body.dr .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45)}
 body.mini nav.side{display:block}}
@media(max-width:860px){header{grid-template-columns:auto minmax(0,1fr) auto;gap:10px}.capl{display:none}.cap{padding:0 12px;gap:8px}.capsule{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){header{gap:6px;padding:0 8px}.logo{font-size:19px;padding:6px 4px}.logo small{display:none}.search button{width:44px}.search input{padding:0 12px}
 .cap{padding:0 10px;font-size:13px;gap:7px}.tm{left:8px;right:8px;top:64px;width:auto;max-height:calc(100vh - 72px);padding:4px 14px 14px}.ups{grid-template-columns:repeat(3,minmax(0,1fr))}
 main{padding:0 12px 32px}.capsule{padding:18px;gap:18px}.grid{grid-template-columns:minmax(0,1fr)}
 .mini,.list .mini{grid-template-columns:140px minmax(0,1fr);gap:10px}.list .ti{font-size:14px}.acts{margin-left:0}.chhead .av{width:56px;height:56px;font-size:24px}}
@media(max-width:400px){.logo span{display:none}.search button{width:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
 <div class="brand">
  <button class="ib" data-act="menu" aria-label="Show or hide navigation"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="logo" href="#" aria-label="DashTube home"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><rect x="2" y="3" width="17" height="17" rx="2" fill="#9be22d" stroke="currentColor" stroke-width="2"/><rect x="7" y="8" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 25l4.5-8.5L28 25z" fill="currentColor"/></svg><span>Dash<b>Tube</b></span><small>pre-2.1</small></a>
 </div>
 <form class="search" role="search" id="sf">
  <input id="q" type="search" placeholder="Search Geometry Dash videos from before 2.1" aria-label="Search videos" autocomplete="off">
  <button aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg></button>
 </form>
 <div class="right"><div class="capw"><button class="cap" id="capb" data-act="tm" aria-haspopup="dialog" aria-expanded="false" aria-controls="tm" aria-describedby="captip"><i></i><span><span class="capl" id="capl">Frozen at </span><span id="capt">Jan 15, 2017</span></span></button><span class="tip" id="captip" role="tooltip">The last day before Geometry Dash update 2.1 came out (Jan 16, 2017). Nothing uploaded on or after it is listed.</span></div></div>
</header>
<div class="tm" id="tm" role="dialog" aria-label="Time machine" hidden></div>
<div class="wrap">
 <nav class="side" id="side" aria-label="Sections">
  <a class="nv" data-k="home" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>Home</a>
  <a class="nv" data-k="official" href="#official"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Official</a>
  <a class="nv" data-k="levels" href="#levels"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 21V4h12l-2.5 4 2.5 4H5"/></svg>Main levels</a>
  <a class="nv" data-k="demons" href="#demons"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20L12 4l9 16z"/></svg>Demons &amp; verifications</a>
  <a class="nv" data-k="creators" href="#creators"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l4.5-1L19 8.5 15.5 5 5 15.5z"/></svg>Creators</a>
  <a class="nv" data-k="community" href="#community"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 1.5 2.4 2.2 4 2.2s3-.7 4-2.2M9 9.5h.01M15 9.5h.01"/></svg>Community</a>
  <a class="nv" data-k="guides" href="#guides"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v14"/></svg>Guides &amp; lists</a>
  <a class="nv" data-k="more" href="#more"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>Gameplay &amp; more</a>
  <hr>
  <button class="nv" type="button" data-act="tm"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14M5 20h14M7 4c0 5 10 5 10 8s-10 3-10 8M17 4c0 5-10 5-10 8s10 3 10 8"/></svg>Time machine</button>

    const d = clampDay(document.getElementById('tmdate').value || '');
    if (!d) { toast('Pick a day between ' + fmtDate(FIRST) + ' and ' + fmtDate(LAST_DAY) + '.'); return; }
    closeTM(false); setWin({kind: 'date', d});
  }
  else if (a === 'more') showMore();
  else if (a === 'cmmore') loadComments(CM.id, false);
  else if (a === 'cmold') { CM.old = !CM.old; renderComments(); }
  else if (a === 'cmkey') { ytKey = ''; ls.set('dt_ytkey', ''); loadComments(CM.id, true); }
  else if (a === 'lucky') { if (W.length) location.hash = 'w-' + enc(W[Math.floor(Math.random() * W.length)].id); else toast('No videos in the range you froze on.'); }
  else if (a === 'clear') { q = ''; qi.value = ''; route(); }
  else if (a === 'clearhist') { hist = []; store.set('dt_hist', hist); route(); }
  else if (a === 'later') {
    const id = b.dataset.id; later = later.includes(id) ? later.filter(x => x !== id) : [id, ...later]; store.set('dt_later', later);
    b.outerHTML = laterBtn(id); setNav(null); toast(later.includes(id) ? 'Saved to Watch later' : 'Removed from Watch later');
  }
  else if (a === 'copy') {
    const u = b.dataset.url;
    try { navigator.clipboard.writeText(u).then(() => toast('Link copied'), () => toast('Copy was blocked here. Link: ' + u)); } catch (err) { toast('Copy was blocked here. Link: ' + u); }
  }
});
document.addEventListener('error', e => {
  const im = e.target;
  if (!im || !im.classList) return;
  if (im.classList.contains('yt') && BY[im.dataset.id]) im.outerHTML = thumb(BY[im.dataset.id]);
  else if (im.classList.contains('avi')) im.outerHTML = initials(im.dataset.ch || '?');
}, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sort') { sort = t.value; route(); }
  else if (t.id === 'updsel') { if (t.value === 'any') setWin({kind: 'all'}); else if (t.value in UI) setWin({kind: 'upd', a: UI[t.value], b: UI[t.value], earlier: false}); }
  else if (t.id === 'tmearlier' && win.kind === 'upd' && win.a > 0) { setWin({...win, earlier: t.checked}); const c = document.getElementById('tmearlier'); if (c) c.focus(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'kf') return;
  e.preventDefault(); const k = document.getElementById('ki').value.trim();
  if (k) { ytKey = k; ls.set('dt_ytkey', k); loadComments(CM.id, true); }
});
document.getElementById('sf').addEventListener('submit', e => {
  e.preventDefault(); q = qi.value.trim(); qi.blur();
  if (view === 'home') route(); else if (location.hash && location.hash !== '#') location.hash = ''; else route();
});
qi.addEventListener('input', () => { if (view === 'home') { q = qi.value.trim(); route(); } });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); qi.focus(); }
  if (e.key === 'Escape') { document.body.classList.remove('dr'); closeTM(!tmEl.hidden); }
});
addEventListener('hashchange', () => { if (V.length) { route(); scrollTo(0, 0); } });
app.innerHTML = '<div class="empty"><p class="big">Loading the archive…</p></div>';
fetch('data.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(init)
  .catch(() => { app.innerHTML = location.protocol === 'file:' ? '<div class="empty"><p class="big">Open this page through a web server.</p><p>Browsers block it from reading its video list, and YouTube blocks the player, when it is opened as a file. See README.txt.</p></div>' : '<div class="empty"><p class="big">The video list didn’t load.</p><p>Reload the page to try again.</p></div>'; });
}
</script>
